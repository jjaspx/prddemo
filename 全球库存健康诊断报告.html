        :root {

            --soft: #F2F7FC;
            --soft-blue: #EAF4FF;
            --line: #E3EAF2;
            --line-strong: #D6E1ED;
            --text: #1F2A37;
            --muted: #6B7A90;
            --light-muted: #97A6B8;
            --blue: #1296DB;
            --blue-dark: #0F75BD;
            --green: #21B573;
            --green-soft: #EAF8EF;
            --red: #E95050;
            --red-soft: #FDEEEE;
            --orange: #F59E0B;
            --orange-soft: #FFF5E3;
            --shadow: 0 10px 28px rgba(31, 42, 55, 0.06);
        }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            padding: 22px 16px 46px;
            line-height: 1.55;
        }
        a { color: inherit; }
        .report-shell { width: min(1220px, 100%); margin: 0 auto; }
        .report-header { padding: 2px 2px 18px; border-bottom: 1px solid var(--line-strong); }
        .title-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        h1 { color: #152033; font-size: 23px; line-height: 1.25; font-weight: 820; letter-spacing: -0.2px; }
        .level-pill {
            display: inline-flex; align-items: center; min-height: 25px; padding: 4px 10px;
            border-radius: 6px; color: #0F75BD; background: #EAF6FF; font-size: 12px; font-weight: 820;
        }
        .detail-link { color: var(--blue); text-decoration: none; font-size: 13px; font-weight: 700; }
        .detail-link:hover { text-decoration: underline; }
        .meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; margin-top: 16px; color: var(--muted); font-size: 13px; }
        .meta-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
        .meta-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #AEBBCD; position: relative; flex: 0 0 auto; }
        .meta-dot::after { content: ''; position: absolute; inset: 5px; border-radius: inherit; background: #AEBBCD; }
        .breadcrumb { margin-top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: #526173; font-size: 12px; }
        .breadcrumb a { color: var(--blue-dark); text-decoration: none; font-weight: 760; }
        .breadcrumb span { color: #97A6B8; }
        .section { margin-top: 22px; }
        .section-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; color: #152033; font-size: 17px; font-weight: 820; }
        .section-heading::before { content: ''; width: 4px; height: 26px; border-radius: 2px; background: var(--blue); box-shadow: 0 0 0 1px rgba(18, 150, 219, 0.08); }
        .summary-grid { display: grid; grid-template-columns: 1.3fr repeat(4, minmax(0, 1fr)); gap: 14px; }
        .hero-score-card, .check-card, .sample-card, .mini-card {
            border-radius: 8px; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 1px 0 rgba(31, 42, 55, 0.02);
        }
        .hero-score-card { padding: 17px 18px; min-height: 148px; background: linear-gradient(135deg, #FFFFFF, #F3F9FF); }
        .hero-label { color: #536174; font-size: 13px; font-weight: 760; }
        .hero-score { margin-top: 8px; font-size: 44px; line-height: 1; font-weight: 900; letter-spacing: -1.4px; }
        .hero-status { margin-top: 10px; display: inline-flex; border-radius: 6px; padding: 4px 9px; font-size: 12px; font-weight: 820; }
        .hero-desc { margin-top: 12px; color: #5E6C80; font-size: 12px; line-height: 1.7; }
        .check-card { min-height: 132px; padding: 16px 16px 14px; }
        .check-title { display: flex; align-items: center; gap: 9px; color: #1F2937; font-size: 14px; font-weight: 800; margin-bottom: 13px; }
        .info-icon { width: 17px; height: 17px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #0B0F17; color: #FFFFFF; font-size: 11px; font-weight: 900; flex: 0 0 auto; }
        .suggest-row { display: grid; grid-template-columns: 66px 1fr; gap: 10px; align-items: start; margin-top: 8px; color: #425166; font-size: 12px; }
        .pill { display: inline-flex; justify-content: center; align-items: center; min-height: 23px; padding: 3px 9px; border-radius: 5px; font-size: 12px; font-weight: 760; white-space: nowrap; }
        .pill-blue { color: var(--blue); background: #EAF6FF; }
        .pill-green { color: #2AA660; background: var(--green-soft); }
        .pill-red { color: var(--red); background: var(--red-soft); }
        .pill-orange { color: #C87800; background: var(--orange-soft); }
        .expert-panel { display: flex; align-items: stretch; gap: 16px; padding: 18px 20px; border-radius: 18px; background: linear-gradient(135deg, #EAF4FF, #F7FBFF); border: 1px solid #DCEEFF; color: #314158; box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.65), 0 10px 22px rgba(15, 23, 42, 0.04); }
        .expert-visual { flex: 0 0 126px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 9px; }
        .expert-icon { display: inline-flex; align-items: center; justify-content: center; min-height: 22px; padding: 4px 9px; border-radius: 999px; color: #FFFFFF; background: linear-gradient(135deg, #00C7FF, #409EFF); box-shadow: 0 8px 18px rgba(18, 150, 219, 0.22); font-size: 10px; font-weight: 900; flex: 0 0 auto; letter-spacing: 0.4px; white-space: nowrap; }
        .expert-avatar { position: relative; width: 108px; height: 108px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(18, 150, 219, 0.26); background: #DFF0FF; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.1), 0 0 0 4px rgba(64, 158, 255, 0.06); }
        .expert-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
        .expert-avatar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(15, 32, 51, 0.18)); pointer-events: none; }
        .expert-speaking-dot { position: absolute; right: 9px; bottom: 9px; width: 9px; height: 9px; border-radius: 999px; background: #21B573; box-shadow: 0 0 0 4px rgba(33, 181, 115, 0.18), 0 0 14px rgba(33, 181, 115, 0.7); z-index: 1; }
        .expert-copy { position: relative; flex: 1; min-width: 0; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(64, 158, 255, 0.14); background: rgba(255, 255, 255, 0.82); font-size: 14px; line-height: 1.78; letter-spacing: 0.05px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04); }
        .expert-copy::before { content: ''; position: absolute; left: -8px; top: 28px; width: 15px; height: 15px; transform: rotate(45deg); background: rgba(255, 255, 255, 0.82); border-left: 1px solid rgba(64, 158, 255, 0.14); border-bottom: 1px solid rgba(64, 158, 255, 0.14); }
        .expert-copy-line { line-height: 1.78; }
        .expert-copy strong { color: #152033; font-weight: 850; }
        .sample-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
        .sample-card { display: block; padding: 13px 14px; text-decoration: none; transition: 180ms ease; }
        .sample-card:hover { border-color: #B7DCF8; box-shadow: 0 8px 18px rgba(18, 150, 219, 0.08); transform: translateY(-1px); }
        .sample-kicker { color: var(--blue); font-size: 11px; font-weight: 840; letter-spacing: 0.4px; }
        .sample-title { margin-top: 5px; color: #1F2937; font-size: 13px; font-weight: 820; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sample-note { margin-top: 6px; color: #7B8797; font-size: 12px; }
        .result-table-wrap { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #EEF2F6; font-size: 13px; vertical-align: middle; }
        th { color: #4C596B; background: #F3F5F8; font-weight: 780; }
        tr:last-child td { border-bottom: 0; }
        td { color: #3C485A; }
        td a { color: var(--blue-dark); text-decoration: none; font-weight: 820; }
        td a:hover { text-decoration: underline; }
        .index-col { width: 58px; color: #6B7280; }
        .status-text { font-weight: 800; }
        .text-red { color: var(--red) !important; }
        .text-green { color: var(--green) !important; }
        .text-orange { color: var(--orange) !important; }
        .bg-red { color: var(--red); background: var(--red-soft); }
        .bg-green { color: var(--green); background: var(--green-soft); }
        .bg-orange { color: var(--orange); background: var(--orange-soft); }
        .value-strong { font-weight: 860; }
        .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .mini-card { padding: 16px; }
        .mini-title { color: #1F2937; font-size: 14px; font-weight: 820; margin-bottom: 12px; }
        .metric-list { display: grid; gap: 10px; }
        .metric-row { display: flex; justify-content: space-between; gap: 14px; color: #5D6B7E; font-size: 13px; }
        .metric-row strong { color: #1F2937; }
        .warehouse-grid { display: grid; grid-template-columns: 1fr 110px 1fr; gap: 14px; align-items: stretch; }
        .warehouse-box { border-radius: 8px; border: 1px solid var(--line); background: #FFFFFF; padding: 16px; }
        .warehouse-label { color: #69798D; font-size: 12px; font-weight: 760; }
        .warehouse-name { margin-top: 7px; color: #1F2937; font-size: 20px; font-weight: 900; }
        .warehouse-action { grid-column: 1 / -1; border-radius: 8px; border: 1px solid #DCEEFF; background: #F4FAFF; padding: 14px 16px; color: #425166; font-size: 13px; }
        .warehouse-transfer { display: grid; place-items: center; color: var(--blue-dark); font-weight: 900; text-align: center; }
        .warehouse-transfer .arrow { display: block; margin-bottom: 8px; font-size: 26px; }
        .chart-card { border-radius: 10px; border: 1px solid var(--line); background: var(--paper); padding: 18px 18px 12px; min-height: 330px; }
        .chart-svg { display: block; width: 100%; height: auto; min-height: 286px; }
        .chart-axis { stroke: #DEE7F0; stroke-width: 1; }
        .chart-grid { stroke: #EEF3F7; stroke-width: 1; stroke-dasharray: 3 5; }
        .chart-label { fill: #8B98AA; font-size: 12px; }
        .chart-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .chart-dot { stroke: #FFFFFF; stroke-width: 2; }
        .legend { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: -4px; color: #6B7A90; font-size: 12px; }
        .legend-item { display: inline-flex; align-items: center; gap: 7px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .footer-note { margin-top: 20px; color: #8A96A8; font-size: 12px; text-align: right; }
        @media (max-width: 980px) {
            .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .hero-score-card { grid-column: span 2; }
            .sample-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .result-table-wrap { overflow-x: auto; }
            table { min-width: 760px; }
            .warehouse-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            body { padding: 16px 10px 32px; }
            h1 { font-size: 20px; }
            .summary-grid, .two-col, .sample-grid { grid-template-columns: 1fr; }
            .hero-score-card { grid-column: auto; }
            .expert-panel { flex-direction: column; gap: 12px; padding: 18px; }
            .expert-visual { flex: 0 0 auto; align-items: flex-start; }
            .expert-avatar { display: none; }
            .expert-copy::before { display: none; }
            .meta-row { gap: 10px 16px; }
            .chart-card { padding: 12px; }
        }
        @media print {
            body { background: #FFFFFF; padding: 0; }
            .report-shell { width: 100%; }
            .check-card, .expert-panel, .result-table-wrap, .chart-card, .sample-card, .hero-score-card, .mini-card { box-shadow: none; }
            .detail-link, .sample-section { display: none; }
        }
    </style>

    const SCORE_THRESHOLDS = { success: 80, warning: 60 };
    const factorOrder = ['缺货风险', '积压风险', '结构健康', '周转天数'];
    const factorWeights = { '缺货风险': '25%', '积压风险': '20%', '结构健康': '25%', '周转天数': '30%' };
    const todayText = '2026-06-01';
    const globalIndexes = { '缺货风险': 68, '积压风险': 48, '结构健康': 85, '周转天数': 82 };

    function escapeHtml(text) {
        return String(text ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function scoreLevel(value) {
        const numeric = Number(value) || 0;
        if (numeric >= SCORE_THRESHOLDS.success) return 'success';
        if (numeric >= SCORE_THRESHOLDS.warning) return 'warning';
        return 'danger';
    }

    function scoreStatus(value) {
        const level = scoreLevel(value);
        if (level === 'success') return '健康';
        if (level === 'warning') return '关注';
        return '风险';
    }

    function textClass(value) {
        const level = scoreLevel(value);
        if (level === 'success') return 'text-green';
        if (level === 'warning') return 'text-orange';
        return 'text-red';
    }

    function bgClass(value) {
        const level = scoreLevel(value);
        if (level === 'success') return 'bg-green';
        if (level === 'warning') return 'bg-orange';
        return 'bg-red';
    }

    function parseMetricNumber(value) {
        return Number(String(value || '').replace(/[^0-9.]/g, '')) || 0;
    }

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function hashText(text) {
        return Array.from(String(text || '')).reduce((hash, char) => ((hash << 5) - hash + char.charCodeAt(0)) | 0, 0);
    }

    function getWeakestMetric(indexes) {
        return Object.entries(indexes || {}).sort((a, b) => a[1] - b[1])[0] || ['综合健康', 0];
    }

    function getPrimaryAction(indexes, score) {
        const [weakName, weakValue] = getWeakestMetric(indexes);
        const actionScore = Math.min(Number(score) || 100, Number(weakValue) || 0);
        const level = scoreLevel(actionScore);
        const actionMatrix = {
            danger: { '缺货风险': '立即补货调拨', '积压风险': '清仓调拨并冻结低效采购', '结构健康': '冻结扩品并校准款色码', '周转天数': '停采促销并提升去化' },
            warning: { '缺货风险': '追发补货并复核在途', '积压风险': '控货促销并跨仓调拨', '结构健康': '结构校准并减少长尾', '周转天数': '控采提转并复盘动销' },
            success: { '缺货风险': '维持小批快反', '积压风险': '持续控货复盘', '结构健康': '复制健康结构', '周转天数': '保持补货节奏' }
        };
        return { label: actionMatrix[level]?.[weakName] || '专项复盘', weakName, weakValue, level };
    }

    function buildCategoryCards(ctName, data) {
        const items = ctRelationSource[ctName]?.categories || ['核心品类', '成长品类', '长尾品类', '季节品类', '清仓品类', '配件'].map(name => ({ name, rows: 0 }));
        const offsets = [-9, -4, 0, 4, 8, 11];
        return items.map((item, index) => {
            const offset = offsets[index % offsets.length];
            const score = Math.max(28, Math.min(96, Math.round((data.score + offset) * 10) / 10));
            const indexes = {
                '周转天数': Math.max(25, Math.min(96, data.indexes['周转天数'] + offset)),
                '缺货风险': Math.max(25, Math.min(96, data.indexes['缺货风险'] + offset - 1)),
                '积压风险': Math.max(25, Math.min(96, data.indexes['积压风险'] + offset - 2)),
                '结构健康': Math.max(25, Math.min(96, data.indexes['结构健康'] + offset + 1))
            };
            const amount = (Math.max(0.04, (100 - score) / 70)).toFixed(2);
            return { name: item.name, sourceRows: item.rows, score, status: scoreStatus(score), indexes, amount };
        }).sort((a, b) => a.score - b.score);
    }

    function buildStyleCards(ctName, data, categoryName = '') {
        const categoryStyles = categoryName ? ctCategoryStyleSource[ctName]?.[categoryName] : null;
        const items = categoryStyles
            ? categoryStyles.map(name => ({ name, category: categoryName, rows: 1 }))
            : (ctRelationSource[ctName]?.styles || ['核心款', '成长款', '新品款', '季节款', '清仓款', '平台款'].map(name => ({ name, rows: 0 })));
        const offsets = [-12, -6, -1, 3, 7, 10];
        return items.map((item, index) => {
            const offset = offsets[index % offsets.length];
            const score = Math.max(24, Math.min(96, Math.round((data.score + offset) * 10) / 10));
            const indexes = {
                '周转天数': Math.max(25, Math.min(96, data.indexes['周转天数'] + offset)),
                '缺货风险': Math.max(25, Math.min(96, data.indexes['缺货风险'] + offset - 2)),
                '积压风险': Math.max(25, Math.min(96, data.indexes['积压风险'] + offset - 3)),
                '结构健康': Math.max(25, Math.min(96, data.indexes['结构健康'] + offset + 2))
            };
            const amount = (Math.max(0.03, (100 - score) / 85)).toFixed(2);
            return { name: item.name, category: item.category || categoryName || 'UNMAPPED', sourceRows: item.rows, score, status: scoreStatus(score), indexes, amount };
        }).sort((a, b) => a.score - b.score);
    }

    function buildReportUrl(level, payload = {}) {
        const params = new URLSearchParams();
        params.set('level', level);
        if (payload.ct) params.set('ct', payload.ct);
        if (payload.category) params.set('category', payload.category);
        if (payload.style) params.set('style', payload.style);
        return `全球库存健康诊断报告.html?${params.toString()}`;
    }

        const params = new URLSearchParams(window.location.search);

        const ctName = ctDashboardData[params.get('ct')] ? params.get('ct') : ctNames[0];
        const data = ctDashboardData[ctName];
        const categories = buildCategoryCards(ctName, data);
        const requestedCategory = params.get('category');
        const category = categories.find(item => item.name === requestedCategory) || categories[0];
        const styles = buildStyleCards(ctName, data, category?.name);
        const requestedStyle = params.get('style');
        const style = styles.find(item => item.name === requestedStyle) || styles[0];
        if (level === 'ct') return { level, ctName, data, categories, category };
        if (level === 'category') return { level, ctName, data, categories, category, styles };
        if (level === 'style') return { level, ctName, data, categories, category, styles, style };
        return { level: 'global', ctName, data, categories };
    }

    function getCtMetrics(ctName, data, categories) {
        const styles = buildStyleCards(ctName, data, categories[0]?.name);
        const riskCategories = categories.filter(item => item.score < SCORE_THRESHOLDS.success);
        const shortageSku = parseMetricNumber(data.risks['断货 SKU']);
        const shortageStyles = Math.max(1, Math.round(shortageSku * 0.23));
        const weakStyles = styles.filter(item => item.score < SCORE_THRESHOLDS.success);
        const clearActions = riskCategories.length ? Math.max(1, Math.round(riskCategories.length * 0.8)) : 0;
        const replenishActions = Math.max(1, Math.round(shortageStyles / 12));
        const transferActions = Math.max(1, Math.ceil(weakStyles.length / 3));
        return { riskCategories, shortageStyles, weakStyles, clearActions, replenishActions, transferActions, pendingActions: clearActions + replenishActions + transferActions };
    }

    function buildStyleAdvisor(ctName, categoryName, style) {
        const seed = Math.abs(hashText(`${ctName}:${categoryName}:${style.name}`));
        const [weakName] = getWeakestMetric(style.indexes);
        let inventoryType = '会卖掉的库存';
        if (style.indexes['积压风险'] < 60) inventoryType = '根本不该存在的库存';
        else if (style.indexes['缺货风险'] < 60) inventoryType = '会缺货的库存';
        else if (style.indexes['周转天数'] < 80 || style.indexes['积压风险'] < 80) inventoryType = '卖得慢的库存';
        const sellableDays = clamp(Math.round(style.indexes['缺货风险'] * 0.72 + (seed % 14) - 16), 8, 88);
        const stockValue = clamp((100 - style.score) / 38 + 0.16 + (seed % 4) * 0.05, 0.18, 2.6).toFixed(2);
        const shortageGap = inventoryType === '会卖掉的库存' ? clamp(36 + seed % 72, 32, 118) : inventoryType === '根本不该存在的库存' ? clamp(88 + seed % 160, 80, 260) : clamp(260 + seed % 520, 240, 780);
        const overstockQty = inventoryType === '会卖掉的库存' ? clamp(180 + seed % 190, 160, 420) : inventoryType === '会缺货的库存' ? clamp(420 + seed % 620, 360, 1120) : clamp(720 + seed % 860, 640, 1680);
        const transferQty = clamp(Math.round(Math.min(shortageGap * 0.86, overstockQty * 0.58)), 32, 680);
        return {
            ctName, categoryName, styleName: style.name, inventoryType, weakName,
            sellableDays, sellableScore: style.indexes['缺货风险'], stockValue,
            shortageWarehouse: 'NJ仓', overstockWarehouse: '国内仓', shortageGap, overstockQty,
            shortageDays: clamp(Math.round(sellableDays * 0.42), 2, 18),
            overstockDays: clamp(Math.round((100 - style.indexes['积压风险']) * 1.65 + 36 + (seed % 36)), 32, 220),
            transferQty,
            route: '国内仓 → NJ仓'
        };
    }

        });
        return rows;
    }

                    <div class="mini-title">单品经营信号</div>
                    <div class="metric-list">
                        <div class="metric-row"><span>Style</span><strong>${escapeHtml(advisor.styleName)}</strong></div>
                        <div class="metric-row"><span>库存类型</span><strong>${escapeHtml(advisor.inventoryType)}</strong></div>
                        <div class="metric-row"><span>关键短板</span><strong>${escapeHtml(advisor.weakName)}</strong></div>
                        <div class="metric-row"><span>库存占用</span><strong>$${escapeHtml(advisor.stockValue)}M</strong></div>
                    </div>
                </div>
                <div class="mini-card">
                    <div class="mini-title">缺货仓 vs 积压仓</div>
                    <div class="warehouse-grid">
                        <div class="warehouse-box"><div class="warehouse-label">调出仓（积压仓）</div><div class="warehouse-name">${escapeHtml(advisor.overstockWarehouse)}</div><div class="metric-row"><span>积压库存</span><strong>${advisor.overstockQty}双</strong></div><div class="metric-row"><span>最长库龄</span><strong>${advisor.overstockDays}天</strong></div></div>
                        <div class="warehouse-transfer"><span class="arrow">→</span><span>${escapeHtml(advisor.route)}<br>${advisor.transferQty}双</span></div>
                        <div class="warehouse-box"><div class="warehouse-label">调入仓（缺货仓）</div><div class="warehouse-name">${escapeHtml(advisor.shortageWarehouse)}</div><div class="metric-row"><span>可售天数</span><strong>${advisor.shortageDays}天</strong></div><div class="metric-row"><span>预测缺口</span><strong>${advisor.shortageGap}双</strong></div></div>
                        <div class="warehouse-action"><strong>建议动作：</strong>从国内仓调往NJ仓，优先用调拨解决局部缺货，同时避免重复补货扩大长库龄。</div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderTrend(model) {
        const values = [clamp(model.score + 6, 0, 100), clamp(model.score + 3, 0, 100), clamp(model.score - 1, 0, 100), clamp(model.score + 2, 0, 100), model.score];
        const shortage = [model.indexes['缺货风险'] + 4, model.indexes['缺货风险'] + 2, model.indexes['缺货风险'] - 3, model.indexes['缺货风险'] - 1, model.indexes['缺货风险']].map(v => clamp(v, 0, 100));
        const overstock = [model.indexes['积压风险'] + 7, model.indexes['积压风险'] + 4, model.indexes['积压风险'] + 1, model.indexes['积压风险'] - 2, model.indexes['积压风险']].map(v => clamp(v, 0, 100));
        const x = [100, 294, 488, 682, 876];
        const y = value => 252 - (value / 100) * 224;
        const line = arr => arr.map((value, index) => `${x[index]},${y(value).toFixed(1)}`).join(' ');
        const dots = (arr, color) => arr.map((value, index) => `<circle class="chart-dot" cx="${x[index]}" cy="${y(value).toFixed(1)}" r="4" fill="${color}"></circle>`).join('');
        return `
            <div class="section-heading">5. 历史主要异常指标对比</div>
            <div class="chart-card">
                <svg class="chart-svg" viewBox="0 0 1040 310" role="img" aria-label="库存健康历史指标趋势图">
                    <line class="chart-axis" x1="54" y1="252" x2="1010" y2="252"></line><line class="chart-axis" x1="54" y1="28" x2="54" y2="252"></line>
                    <g><line class="chart-grid" x1="54" y1="28" x2="1010" y2="28"></line><line class="chart-grid" x1="54" y1="73" x2="1010" y2="73"></line><line class="chart-grid" x1="54" y1="118" x2="1010" y2="118"></line><line class="chart-grid" x1="54" y1="163" x2="1010" y2="163"></line><line class="chart-grid" x1="54" y1="208" x2="1010" y2="208"></line></g>
                    <g class="chart-label"><text x="18" y="33">100</text><text x="25" y="78">80</text><text x="25" y="123">60</text><text x="25" y="168">40</text><text x="25" y="213">20</text><text x="33" y="257">0</text><text x="82" y="282">02月</text><text x="276" y="282">03月</text><text x="470" y="282">04月</text><text x="664" y="282">05月</text><text x="858" y="282">06月</text></g>
                    <polyline class="chart-line" style="stroke:#2F80ED" points="${line(values)}"></polyline>
                    <polyline class="chart-line" style="stroke:#21B573" points="${line(shortage)}"></polyline>
                    <polyline class="chart-line" style="stroke:#E95050" points="${line(overstock)}"></polyline>
                    <g>${dots(values, '#2F80ED')}${dots(shortage, '#21B573')}${dots(overstock, '#E95050')}</g>
                </svg>
                <div class="legend"><span class="legend-item"><span class="legend-dot" style="background:#2F80ED"></span>健康总指数</span><span class="legend-item"><span class="legend-dot" style="background:#21B573"></span>缺货风险</span><span class="legend-item"><span class="legend-dot" style="background:#E95050"></span>积压风险</span></div>
            </div>
        `;
    }

    function renderReport() {
        const model = getModel(getState());
        document.getElementById('reportHeader').innerHTML = renderHeader(model);
        document.getElementById('sampleSection').innerHTML = renderSamples(model);
        document.getElementById('abnormalSection').innerHTML = renderAbnormal(model);
        document.getElementById('expertSection').innerHTML = renderExpert(model);
        document.getElementById('checkSection').innerHTML = renderCheck(model);
        document.getElementById('detailSection').innerHTML = renderDetail(model);
        document.getElementById('trendSection').innerHTML = renderTrend(model);
    }

    renderReport();
    </script>
</body>
</html>
